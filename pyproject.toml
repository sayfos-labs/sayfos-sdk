[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "sayfos-sdk"
version = "0.1.0"
description = "Sayfos Protocol — Agent Runtime Control Protocol"
readme = "README.md"
license = {text = "Apache-2.0"}
requires-python = ">=3.10"
authors = [
    {name = "SAYFOS", email = "278927879@qq.com"},
]
keywords = [
    "ai-safety",
    "agent-security",
    "intent-verification",
    "causal-consistency",
    "budget-governance",
    "source-chain",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Security",
    "Topic :: Software Development :: Libraries",
]

[project.scripts]
sayfos = "sayfos.cli:main"
sayfos-server = "sayfos.api:main"

[project.optional-dependencies]
langchain = ["langchain-core>=0.2.0"]
api = ["fastapi>=0.110", "uvicorn>=0.29"]
dev = ["pytest>=8.0", "pytest-asyncio>=0.23", "ruff>=0.4"]

[tool.setuptools.packages.find]
where = ["."]

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.pytest.ini_options]
testpaths = ["tests"]
