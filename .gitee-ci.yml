# Gitee CI — Sayfos SDK
# Runs tests on every push to master.
# Requires: Python 3.10+ with pip.

stages:
  - name: test
    image: python:3.11-slim
    steps:
      - name: install
        run: |
          pip install -e ".[dev]"
      - name: pytest
        run: |
          python -m pytest tests/ -v
